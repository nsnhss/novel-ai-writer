[package]
name = "novel-ai-writer"
version = "1.0.0"
description = "AI 小说写作软件 — 本地桌面端创作工具"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "novel_ai_writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database & data
rusqlite = { version = "0.34", features = ["bundled-sqlcipher-vendored-openssl", "backup", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }



# File parsing
epub = "2"
encoding_rs = "0.8"
regex = "1"

# Async & error handling
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "2"

# HTTP
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }

# Utilities
dirs = "6"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
log = "0.4"

# Token counting (MVP: OpenAI cl100k_base; can migrate to tokenizers later)
tiktoken-rs = "0.6"

# Streaming / cancellation
futures = "0.3"

# Chinese word segmentation for style profile keyword extraction
jieba-rs = "0.7"
keyring = { version = "3", features = ["windows-native"] }

# Parallelism for vector search
rayon = "1"

# f16 半精度向量缓存: 50K x 1024 维缓存内存从 ~205MB 降到 ~103MB
half = "2"
